<script>
(()=>{'use strict';
// Anki: generic offline flashcards. Card data lives in decks/*.json (see README.md).
const DECK_KEY='anki_current_deck';
const app=document.querySelector('#app');
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const today=()=>learningDay();
let deck=null, fields=[], fieldMap={}, data=[], key='', deckList=[];
let ready=false, localLoaded=false, savedLocally=false, offlineReady=false, storageWarning=false, saveRevision=0, mirrorWrites=Promise.resolve(), dbPromise=null;
let store={progress:{},edits:{},history:[],settings:{}}, practiceMode='', tab='quiz', page='すべて', category='すべて', search='', batch=[], results={}, answers={}, showAnswers=true, orderMode='ordered', editId=null, quizFilters=cleanFilters(), recording=true, sandbox=null, scratchSessions={}, activeDay='';

// ---------- deck definition ----------
function prepareDeck(raw){
 const fail=m=>{throw Error(m)};
 if(!raw||typeof raw!=='object'||raw.format!==1)fail('対応していない形式です（format: 1 が必要）');
 if(typeof raw.id!=='string'||!/^[\w-]+$/.test(raw.id))fail('id は英数字・_・- で指定してください');
 if(!Array.isArray(raw.fields)||!raw.fields.length)fail('fields がありません');
 if(!Array.isArray(raw.cards)||!raw.cards.length)fail('cards がありません');
 const d={choiceFallback:true,...raw};
 d.title=raw.title||raw.id;
 d.labels={item:'カード',counter:'枚',...(raw.labels||{})};d.labels.list=d.labels.list||d.labels.item+'一覧';
 d.fields=raw.fields.map(f=>({type:'text',...f,aspect:f.aspect||f.key}));
 const keys=new Set(d.fields.map(f=>f.key));
 for(const f of d.fields){if(!/^[\w-]+$/.test(f.key)||!/^[\w-]+$/.test(f.aspect))fail('field の key は英数字で指定してください：'+f.key);if(!['text','image'].includes(f.type))fail('field の type は text か image です：'+f.key)}
 if(keys.size!==d.fields.length)fail('field の key が重複しています');
 if(!Array.isArray(d.modes)||!d.modes.length)d.modes=[{id:'main',label:'通常',prompt:d.fields[0].key,ask:d.fields.slice(1).filter(f=>!f.hidden).map(f=>f.key)}];
 for(const m of d.modes){
  if(!/^[\w-]+$/.test(m.id||''))fail('mode の id がありません');
  if(m.prompt!=='example'&&!keys.has(m.prompt))fail('mode の prompt が fields にありません：'+m.prompt);
  if(m.prompt==='example'&&!d.examples)fail('例文モードには examples が必要です');
  if(!Array.isArray(m.ask)||!m.ask.length||m.ask.some(k=>!keys.has(k)))fail('mode の ask が fields にありません：'+m.id);
  m.label=m.label||m.id;
 }
 const ids=new Set();
 for(const c of d.cards){if(!Number.isInteger(c.id)||c.id<1||ids.has(c.id))fail('カードの id は重複しない正の整数にしてください：'+JSON.stringify(c).slice(0,80));ids.add(c.id)}
 d.storageKey=raw.storageKey||'anki_'+d.id;
 return d;
}
function setupDeck(){
 fields=deck.fields;fieldMap=Object.fromEntries(fields.map(f=>[f.key,f]));key=deck.storageKey;
 data=deck.cards.map(c=>({...c,sourceId:c.sourceId||c.id,partIndex:c.partIndex||0}));
 document.title=deck.title+' - Anki';
 document.querySelector('[data-tab="words"]').textContent=deck.labels.item+'一覧';
 renderDeckSlot();
}
function modeIndex(){return Math.max(0,deck.modes.findIndex(m=>m.id===practiceMode))}
function currentMode(){return deck.modes[modeIndex()]}
function validMode(id){return deck.modes.some(m=>m.id===id)?id:deck.modes[0].id}
function aspects(){return currentMode().ask.map(k=>fieldMap[k].aspect)}
function aspectField(a){return fields.find(f=>f.aspect===a)}
function aspectLabel(a){return aspectField(a)?.label||a}
function askLabels(){return currentMode().ask.map(k=>fieldMap[k].label)}
function headKey(){return fields[0].key}
function sectionKey(){return deck.section?.field}
function categoryKey(){return deck.category?.field}
function sectionValues(){const k=sectionKey();return k?[...new Set(data.map(x=>x[k]).filter(Boolean))]:[]}
function textOf(x){return fields.filter(f=>f.type==='text'&&!f.hidden).map(f=>x[f.key]??'').join('')}
function joinLabels(list){return list.join('・')}
function renderValue(f,value,extra=''){
 if(f?.type==='image')return value?`<img class="field-image ${extra}" src="${esc(value)}" alt="${esc(f.label)}" loading="lazy">`:'';
 return esc(value);
}

// ---------- study state ----------
function learningStore(){return recording?store:sandbox||store}
function clone(value){return JSON.parse(JSON.stringify(value))}
function learningDay(time=Date.now()){return new Date(time+5*3600000).toISOString().slice(0,10)}
function addDays(day,n){const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function addMonth(day){const d=new Date(day+'T12:00:00Z'),date=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+1);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(date,last));return d.toISOString().slice(0,10)}
function initializeStudy(){store.study=store.study||{};if(store.studyVersion===1)return;for(const s of Object.values(store.progress))if(s.level==='mastered')s.level='recall';store.studyVersion=1}
function blankRecall(){return Object.fromEntries(aspects().map(a=>[a,false]))}
function journal(id,create=false){const root=learningStore();root.study=root.study||{};const mode=root.study[practiceMode]||(create?(root.study[practiceMode]={}):{});if(!mode[id]&&create)mode[id]={base:Object.fromEntries(aspects().map(a=>[a,clone(state(id,a))])),events:[],memory:emptyMemory()};return mode[id]}
function emptyMemory(){return {streak:0,due:'',lastSuccessDay:'',recallDay:'',recall:blankRecall()}}
function memory(id){return journal(id)?.memory||emptyMemory()}
function replayStudy(id){const j=journal(id,true),states=clone(j.base),m=emptyMemory(),list=aspects();for(const e of j.events){
 if(!states[e.aspect])states[e.aspect]=emptyState();
 applyGrade(states[e.aspect],e.correct,{method:e.method,day:e.day});
 if(m.recallDay!==e.day){m.recallDay=e.day;m.recall=blankRecall()}
 if(!e.correct){m.streak=0;m.due=e.day;m.lastSuccessDay='';m.recall=blankRecall();for(const s of Object.values(states)){s.level='choice';s.streak=0}}
 else if(e.method==='recall'){m.recall[e.aspect]=true;if(list.every(a=>m.recall[a])&&m.lastSuccessDay!==e.day&&(!m.due||e.day>=m.due)){m.streak++;m.lastSuccessDay=e.day;m.due=m.streak===1?addDays(e.day,1):m.streak===2?addDays(e.day,7):addMonth(e.day)}}
 }j.memory=m;for(const a of list){if(!states[a])states[a]=emptyState();states[a].due=m.due;setState(id,a,states[a])}return m}
function dailyFacts(id,day=today()){const events=(journal(id)?.events||[]).filter(e=>e.day===day);return {answered:!!events.length,choice:events.some(e=>e.correct&&e.method==='choice'),recall:events.some(e=>e.correct&&e.method==='recall'),wrong:events.some(e=>!e.correct),ok:memory(id).lastSuccessDay===day}}
function cleanFilters(v={}){return {scope:['due','all','established','waiting','unestablished','review'].includes(v?.scope)?v.scope:'due',status:['all','new','wrongToday','everWrong','choice','recall'].includes(v?.status)?v.status:'all',streak:['all','0','1','2','3+'].includes(v?.streak)?v.streak:'all',excludeChoice:!!v?.excludeChoice,excludeRecall:!!v?.excludeRecall,excludeAnswered:!!v?.excludeAnswered,query:typeof v?.query==='string'?v.query:''}}
function matchesStudyFilters(x){const f=quizFilters,m=memory(x.id),facts=dailyFacts(x.id),states=aspects().map(a=>state(x.id,a)),waiting=!!m.due&&m.due>today();
 if((f.scope==='due'&&waiting)||(f.scope==='established'&&!m.streak)||(f.scope==='waiting'&&!waiting)||(f.scope==='unestablished'&&m.streak)||(f.scope==='review'&&(!m.streak||waiting)))return false;
 if((f.excludeChoice&&facts.choice)||(f.excludeRecall&&facts.recall)||(f.excludeAnswered&&facts.answered))return false;
 if(f.streak!=='all'&&(f.streak==='3+'?m.streak<3:m.streak!==+f.streak))return false;
 if((f.status==='new'&&states.some(s=>s.graded))||(f.status==='wrongToday'&&!facts.wrong)||(f.status==='everWrong'&&!states.reduce((n,s)=>n+s.wrong,0))||(f.status==='choice'&&!states.some(s=>s.level==='choice'))||(f.status==='recall'&&states.some(s=>s.level==='choice')))return false;
 return !f.query||textOf(x).includes(f.query)}

// ---------- storage ----------
function validStore(x){return x&&typeof x==='object'&&x.progress&&typeof x.progress==='object'&&!Array.isArray(x.progress)&&x.edits&&typeof x.edits==='object'&&!Array.isArray(x.edits)}

function load(){try{const x=JSON.parse(localStorage.getItem(key));if(validStore(x)){localLoaded=true;return prepareStore(x)}}catch(e){storageWarning=true}return {progress:{},edits:{},history:[],settings:{}}}
// The database name predates the rename; keep it so existing backups are found.
function openBackupDb(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{
 if(!('indexedDB' in window)){reject(Error('unavailable'));return}
 const req=indexedDB.open('kanbun_local_backup',1);
 req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data')};
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('blocked'));
});return dbPromise}
async function readBackup(){const db=await openBackupDb();return new Promise((resolve,reject)=>{const req=db.transaction('data','readonly').objectStore('data').get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}

function updateSaveStatus(){const el=document.querySelector('#saveStatus');if(!el)return;el.textContent=(savedLocally?'端末に保存済み':storageWarning?'端末への保存に失敗しています。学習データ保存でバックアップしてください。':'端末に保存中…')+(offlineReady?' ・ オフライン利用可':'');el.style.color=storageWarning?'var(--red)':'var(--muted)'}
function captureSession(){store.practiceMode=practiceMode;store.settings.quiz={page,category,orderMode,filters:quizFilters};store.settings.recording=recording;
 const q={version:3,day:activeDay,tab,page,category,search,batch:[...batch],results:clone(results),answers:clone(answers),showAnswers,orderMode,filters:clone(quizFilters),scrollY:window.scrollY||0};

}
function save(){if(!ready)return;captureSession();store.savedAt=Date.now();const snapshot=JSON.stringify(store),revision=++saveRevision;let primary=false;
 try{localStorage.setItem(key,snapshot);primary=true;savedLocally=true;storageWarning=false}catch(e){savedLocally=false;storageWarning=true}
 updateSaveStatus();
 mirrorWrites=mirrorWrites.catch(()=>{}).then(()=>writeBackup(JSON.parse(snapshot))).then(()=>{if(revision===saveRevision){savedLocally=true;storageWarning=false;updateSaveStatus()}}).catch(()=>{if(revision===saveRevision&&!primary){savedLocally=false;storageWarning=true;updateSaveStatus()}});
}
function restoreSession(){const q=recording?(store.sessions?.[practiceMode]||(modeIndex()===0?store.session:null)):scratchSessions[practiceMode],preferences=q||store.settings.quiz||{};
 tab=['quiz','words','progress'].includes(preferences.tab)?preferences.tab:'quiz';page=['すべて',...sectionValues()].includes(preferences.page)?preferences.page:'すべて';category=typeof preferences.category==='string'?preferences.category:'すべて';search=typeof preferences.search==='string'?preferences.search:'';
 orderMode=preferences.orderMode==='random'?'random':'ordered';showAnswers=preferences.showAnswers!==false;quizFilters=cleanFilters(preferences.filters);
 if(!q||(q.day&&q.day!==today())||![1,2,3].includes(q.version)||!q.answers||typeof q.answers!=='object'||!q.results||typeof q.results!=='object')return false;
 answers=clone(q.answers);results={};
 for(const [k,r] of Object.entries(q.results))if(questionKey(k)&&r&&r.before&&typeof r.correct==='boolean'&&!r.skipped){
  results[k]={...r,historyIndex:q.version===1?q.historyIndex:r.historyIndex};
 }
 const expected=groupEntries(filtered()).flat().map(x=>x.id);
 const valid=[2,3].includes(q.version)&&Array.isArray(q.batch)&&new Set(q.batch).size===q.batch.length&&q.batch.every(id=>expected.includes(id));
 if(valid)batch=q.batch;else newBatch();
 // Migrate pending answers from the older batch screen exactly once.
 if(q.version===1)for(const [k,value] of Object.entries(answers)){
  const parts=questionKey(k);if(!parts||results[k])continue;
  const [id,a]=parts,x=item(id),before=state(id,a),f=aspectField(a);
  if(before.level==='choice'&&typeof value==='string'&&value.trim())recordGrade(k,isCorrect(f,value,x[f.key]));

function questionKey(k){const m=/^(\d+):([\w-]+)$/.exec(k);return m&&aspects().includes(m[2])&&data.some(x=>x.id===+m[1])?[+m[1],m[2]]:null}
function splitForms(word){return [...new Set(String(word).replace(/（[^）]*）|\([^)]*\)|[①-⑳]/g,'').split('・').map(w=>w.trim()).filter(Boolean))]}
// Older saves stored split cards (e.g. 爾・而・女) under their first card only.
function migrateCards(){if(store.cardVersion===2)return;const list=deck.modes[0].ask.map(k=>fieldMap[k].aspect),head=headKey();
 for(const x of data){if(x.id===x.sourceId)continue;
  for(const a of list){const old=store.progress[x.sourceId+':'+a];if(old&&!store.progress[x.id+':'+a])store.progress[x.id+':'+a]={...old}}
  const edit=store.edits[x.sourceId];if(edit&&!store.edits[x.id]){const forms=edit[head]?splitForms(edit[head]):[];store.edits[x.id]={...edit,[head]:forms[x.partIndex]||x[head]}}

}

// ---------- cards ----------
function item(id){const x=data.find(x=>x.id===+id);if(!x)return null;const custom=store.edits[id]||{},edited=Object.assign({},x,custom);
 if(currentMode().prompt==='example'){const contextual=exampleFor(edited)||{};for(const k of currentMode().ask)edited[k]=custom[k]||contextual[k]||x[k]}
 return edited}
function items(){return data.map(x=>item(x.id))}
function emptyState(){return{level:'choice',mc:0,free:0,wrong:0,streak:0,last:'',due:'',firstFreeDay:'',laterHit:false,graded:0}}
function progressKey(id,aspect){return (modeIndex()>0?practiceMode+':':'')+id+':'+aspect}
function belongsToMode(k){return modeIndex()>0?k.startsWith(practiceMode+':'):/^\d+:/.test(k)}
function state(id,aspect){return learningStore().progress[progressKey(id,aspect)]||emptyState()}
function setState(id,aspect,s){learningStore().progress[progressKey(id,aspect)]=s}
function badge(s){return s.level==='mastered'?'定着':s.level==='recall'?'自己採点':'四択'}
function levelCount(){const list=aspects(),all=items();let master=0,free=0,attempt=0;for(let x of all){const established=memory(x.id).streak>0;for(let a of list){let s=state(x.id,a);if(established)master++;if(s.level==='recall')free++;if(s.graded)attempt++}}return{all:all.length*list.length,master,free,attempt}}
function stats(){let x=levelCount();return `<div class="stats"><div class="stat"><strong>${groupEntries(items()).length}</strong><span>収録${esc(deck.labels.item)}</span></div><div class="stat"><strong>${x.attempt}<small style="font-size:12px"> / ${x.all}</small></strong><span>学習した項目</span></div><div class="stat"><strong>${x.master}</strong><span>定着中の項目</span></div></div>`}
function randSort(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filtered(){const sk=sectionKey(),ck=categoryKey();return items().filter(x=>(!sk||page==='すべて'||x[sk]===page)&&(!ck||category==='すべて'||x[ck]===category))}
function groupEntries(entries){const groups=new Map(),head=headKey(),ck=categoryKey();for(const x of entries){const k=JSON.stringify([x[head],ck?x[ck]:'']);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}return [...groups.values()].map(group=>group.sort((a,b)=>a.sourceId-b.sourceId||a.partIndex-b.partIndex))}
function newBatch(){const groups=groupEntries(filtered().filter(matchesStudyFilters));if(orderMode==='random')randSort(groups);batch=groups.flat().map(x=>x.id)}
function restartPractice(){for(const id of batch)for(const a of aspects()){const k=id+':'+a;delete answers[k];delete answers['_opts_'+k];delete results[k]}newBatch();render();window.scrollTo({top:0,behavior:'instant'})}
function changeScope(){newBatch();render();window.scrollTo({top:0,behavior:'instant'})}

// ---------- answers and choices ----------
function normalize(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[ー〜～（）()・。、，,\s「」『』\[\]【】①②③④⑤！!？?]/g,'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96))}
function variants(value){let s=value.replace(/（[^）]*）/g,'').trim();let b=[value,s,...[...value.matchAll(/（([^）]*)）/g)].map(m=>m[1])];for(let v of [value,s])for(let split of ['・','／','/','、',';'])if(v.includes(split))b.push(...v.split(split));return [...new Set(b.map(normalize).filter(Boolean))]}
function answerVariants(f,value){return f?.type==='image'?[String(value)]:variants(String(value??''))}
function isCorrect(f,ans,solution){if(f?.type==='image')return ans===solution;const a=normalize(ans);if(!a)return false;return variants(solution).some(v=>a===v)}
function overlapAnswers(f,a,b){const av=answerVariants(f,a),bv=answerVariants(f,b);return av.some(v=>bv.includes(v))}
function exclusionGroups(f){return [...(deck.choiceExclusions?.[f.key]||[]),...(currentMode().choiceExclusions?.[f.key]||[])]}
// Exclusions use card source IDs so they apply to every spelling and contextual variant.
function relatedDistractor(a,b,aspect){
 const head=headKey();if(a.sourceId===b.sourceId||a[head]===b[head])return true;

}
function choicePool(x,aspect){
 const f=aspectField(aspect),field=f.key,all=items(),group=deck.choiceGroup;
 const blockedAnswers=new Set(all.filter(o=>relatedDistractor(x,o,aspect)).flatMap(o=>answerVariants(f,o[field])));
 for(const variant of answerVariants(f,x[field]))blockedAnswers.add(variant);
 const pick=list=>[...new Set(list.filter(o=>!relatedDistractor(x,o,aspect)).map(o=>o[field]))].filter(value=>value&&!answerVariants(f,value).some(variant=>blockedAnswers.has(variant)));
 const pool=pick(group?all.filter(o=>o[group]===x[group]):all);pool.primary=pool.length;
 if(group&&deck.choiceFallback&&pool.length<3)for(const value of pick(all))if(!pool.includes(value))pool.push(value);

}
function choices(x,aspect,pool=choicePool(x,aspect)){
 const f=aspectField(aspect),solution=x[f.key],vals=[solution];
 for(const value of [...randSort(pool.slice(0,pool.primary)),...randSort(pool.slice(pool.primary))]){
  if(!vals.some(selected=>overlapAnswers(f,selected,value)))vals.push(value);
  if(vals.length===4)break;
 }
 return randSort(vals).map(val=>({val,label:val}));
}
function senseNumber(x){const siblings=groupEntries(batch.map(item)).find(group=>group.some(o=>o.id===x.id));return siblings&&siblings.length>1?' '+(siblings.findIndex(o=>o.id===x.id)+1):''}
function question(x,aspect){const k=x.id+':'+aspect,f=aspectField(aspect),before=state(x.id,aspect),mode=before.level==='choice'?'choice':'recall',ans=answers[k],label=esc(f.label)+senseNumber(x);
 let html=`<div class="question" data-question="${k}"><div class="qtitle">${label}<span class="level">${badge(before)}</span></div>`;
 if(mode==='choice'){
  const solution=x[f.key],pool=choicePool(x,aspect);
  let opts=answers['_opts_'+k];
  const valid=Array.isArray(opts)&&opts.length>=2&&opts.length<=4
   &&opts.filter(o=>o?.val===solution).length===1
   &&opts.every(o=>o&&(o.val===solution||pool.includes(o.val)))
   &&new Set(opts.map(o=>o.val)).size===opts.length;
  if(!valid)opts=answers['_opts_'+k]=choices(x,aspect,pool);
  if(opts.length!==4)html=html.replace('>四択</span>',`>${opts.length}択</span>`);
  html+=`<div class="choices${f.type==='image'?' image-choices':''}">${opts.map((o,i)=>`<label class="choice"><input type="radio" name="${k}" value="${esc(o.val)}" aria-label="${esc(f.type==='image'?f.label+' '+'ABCD'[i]:o.label)}"><span><span style="color:var(--muted);font-size:12px">${'ABCD'[i]}. </span>${renderValue(f,o.label)}</span></label>`).join('')}</div>`;
 }else if(!ans?.revealed){
  html+=`<div class="recall-actions"><button class="btn primary" type="button" data-recall="${k}" data-action="remember">思い出した</button><button class="btn" type="button" data-recall="${k}" data-action="forget">思い出せない</button></div>`;
 }else{
  html+=`<div class="answer ok"><strong>答え</strong><div class="correct-answer">${renderValue(f,x[f.key])}</div></div><p class="sub">思い出した答えは合っていましたか？</p><div class="recall-actions"><button class="btn" type="button" data-self-grade="${k}" data-correct="true">○ 正解</button><button class="btn danger" type="button" data-self-grade="${k}" data-correct="false">× 不正解</button></div>`;

}
function answerSummary(x,aspect){const k=x.id+':'+aspect,r=results[k];if(!r)return '';

}
// Ask each aspect in order; the next one appears after the previous is answered.
function exerciseHtml(x){let html='';for(const a of aspects()){if(results[x.id+':'+a]){html+=answerSummary(x,a);continue}html+=question(x,a);break}return html+memoryStatus(x)}
function recordGrade(k,correct){const parts=questionKey(k);if(!parts||results[k]||typeof correct!=='boolean')return false;
 const [id,a]=parts,before=clone(state(id,a)),day=today(),method=before.level==='choice'?'choice':'recall',j=journal(id,true),root=learningStore();
 const event={id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),aspect:a,method,day,at:Date.now(),correct};j.events.push(event);replayStudy(id);
 root.history.push({mode:practiceMode,id,aspect:a,method,day,at:event.at,n:1,correct:correct?1:0});results[k]={correct,before,day,eventId:event.id,recorded:recording,historyIndex:root.history.length-1};return true;
}
function answerChoice(k,value){if(refreshStudyDay())return;const parts=questionKey(k);if(!parts||results[k]||!batch.includes(parts[0])||state(...parts).level!=='choice')return;

 answers[k]=value;const x=item(parts[0]),f=aspectField(parts[1]);recordGrade(k,isCorrect(f,value,x[f.key]));refreshQuestion(k);
}
function revealRecall(k,recalled){if(refreshStudyDay())return;const parts=questionKey(k);if(!parts||results[k]||answers[k]?.revealed||state(...parts).level==='choice')return;

}
function rateRecall(k,correct){if(refreshStudyDay())return;if(results[k]||!answers[k]?.revealed||!answers[k].recalled)return;answers[k].correct=correct;recordGrade(k,correct);refreshQuestion(k)}
function refreshQuestion(k){const parts=questionKey(k);
 if(parts){const x=item(parts[0]),exercise=document.querySelector('#exercise-'+x.id),top=exercise?.getBoundingClientRect().top,active=exercise?.querySelector('.question:not(.question-result)');
  if(exercise){exercise.innerHTML=exerciseHtml(x);exercise.querySelectorAll('[data-question]').forEach(bindQuestion)}
  const translation=document.querySelector('#translation-'+x.id);if(translation)translation.innerHTML=exampleTranslation(x);
  // Keep the question slot in place when the answer above it expands.
  if(active&&exercise&&top>=64&&top<window.innerHeight){const shift=exercise.getBoundingClientRect().top-top;if(Math.abs(shift)>1)window.scrollBy({top:shift,behavior:'instant'})}

}
function bindQuestion(el){if(!el)return;
 el.querySelectorAll('input[type=radio]').forEach(input=>input.addEventListener('change',e=>answerChoice(e.target.name,e.target.value)));
 el.querySelectorAll('[data-recall]').forEach(button=>button.addEventListener('click',()=>revealRecall(button.dataset.recall,button.dataset.action==='remember')));
 el.querySelectorAll('[data-self-grade]').forEach(button=>button.addEventListener('click',()=>rateRecall(button.dataset.selfGrade,button.dataset.correct==='true')));

// ---------- examples ----------
function exampleFor(x){const example=deck.examples?.[x.sourceId];if(!example)return null;const variant=example.forms?.[x[headKey()]];return variant?{...example,...variant}:example}
function exampleHtml(x){

 return `<div class="example-sentence">${parts.map(part=>part.startsWith('{{')?'<u>'+esc(part.slice(2,-2))+'</u>':esc(part)).join('')}</div><div id="translation-${x.id}">${exampleTranslation(x)}</div>${e.source?`<div class="example-source">${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.source)}</a>`:esc(e.source)}</div>`:''}`;

function exampleTranslation(x){

 return `<div class="example-translation">${shown.map((r,i)=>`<div${i?' style="margin-top:5px"':''}>${esc(r.label)}：${esc(e[r.key])}</div>`).join('')}</div>`;
}
function examplePanel(x){if(!exampleFor(x))return '';const exampleMode=currentMode().prompt==='example',shown=exampleMode||answers['_example_'+x.id];return `${!exampleMode?`<button class="btn small example-toggle" data-example="${x.id}" type="button">${shown?'例文を隠す':'例文を表示'}</button>`:''}${shown?exampleHtml(x):''}`}

// ---------- screens ----------
function switchMode(mode){if(mode===practiceMode)return;save();practiceMode=validMode(mode);answers={};results={};batch=[];if(!restoreSession())newBatch();render();window.scrollTo({top:0,behavior:'instant'})}
function sectionOptions(id){const s=deck.section;if(!s)return '';return `<select id="${id}" aria-label="${esc(s.label||'範囲')}"><option value="すべて" ${page==='すべて'?'selected':''}>${esc(s.all||'すべて')}</option>${sectionValues().map(v=>`<option value="${esc(v)}" ${page===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function categoryOptions(){const ck=categoryKey(),sk=sectionKey();let groups=['すべて',...new Set(items().filter(x=>!sk||page==='すべて'||x[sk]===page).map(x=>x[ck]).filter(Boolean))];return groups.map(g=>`<option value="${esc(g)}" ${category===g?'selected':''}>${esc(g==='すべて'?(deck.category.all||'すべて'):g)}</option>`).join('')}
function categorySelect(id){return categoryKey()?`<select id="${id}" aria-label="${esc(deck.category.label||'分類')}">${categoryOptions()}</select>`:''}
function quizTally(){const list=aspects();let answered=0,correct=0;for(const id of batch)for(const a of list){const r=results[id+':'+a];if(r){answered++;if(r.correct)correct++}}return `<strong>${groupEntries(batch.map(item)).length}${esc(deck.labels.counter)}・${batch.length*list.length}項目</strong><span class="sub">回答済み ${answered}　正解 ${correct}　未回答 ${batch.length*list.length-answered}</span>`}
function promptHtml(x,mode){if(mode.prompt==='example')return `<div class="example-heading">${esc(mode.heading||'下線部の'+joinLabels(askLabels()))}</div>`;const f=fieldMap[mode.prompt];return f.type==='image'?`<div class="quizword">${renderValue(f,x[f.key],'prompt-image')}</div>`:`<div class="quizword">${esc(x[f.key])}</div>`}
function quiz(){const mode=currentMode(),modes=deck.modes,labels=askLabels();
 let summary=`<div id="quizStats">${stats()}</div>`,opts=`<div class="panel"><div class="flex">${modes.length>1?`<select id="practiceMode" aria-label="学習モード">${modes.map(m=>`<option value="${esc(m.id)}" ${m.id===practiceMode?'selected':''}>${esc(m.label)}</option>`).join('')}</select>`:''}${deck.section?`<span class="sub">${esc(deck.section.label||'出題範囲')}</span>`:''}${sectionOptions('pageSelect')}${categorySelect('categorySelect')}<select id="orderSelect" aria-label="出題順"><option value="ordered" ${orderMode==='ordered'?'selected':''}>順番どおり</option><option value="random" ${orderMode==='random'?'selected':''}>ランダム順</option></select>${orderMode==='random'?'<button class="btn small" type="button" id="reshuffle">並べ替える</button>':''}<button class="btn small" type="button" id="restart">もう一度練習</button></div><p class="sub" style="margin:10px 0 0">${modes.length>1?esc(joinLabels(modes.map(m=>m.label)))+'の習熟度は別管理です。':''}${labels.length>1?esc(labels.join('→'))+'の順に出題し、':''}回答時に自動保存します。自己採点は答えを確認して○×を選びます。未回答は履歴に影響しません。</p>${studyFilterHtml()}</div>`;
 if(!batch.length)return summary+opts+'<div class="panel empty">今の条件に合う問題はありません。出題対象を「すべて」にするか、絞り込みを変更できます。</div>';
 const groups=groupEntries(batch.map(item)),sk=sectionKey(),ck=categoryKey();
 const cards=groups.map((entries,i)=>{const x=entries[0],marks=[sk?[...new Set(entries.map(o=>o[sk]).filter(Boolean))].join('・'):'',ck?x[ck]:''].filter(Boolean).join('・');return `<section class="panel"><div class="countmark">${i+1} / ${groups.length}　<span class="inline-mark">${esc(marks)}</span></div>${promptHtml(x,mode)}${entries.map(o=>`<div class="sense" data-id="${o.id}">${examplePanel(o)}<div class="exercise" id="exercise-${o.id}" aria-live="polite">${exerciseHtml(o)}</div></div>`).join('')}</section>`}).join('');
 return summary+opts+`<div class="quizhead" id="quizTally">${quizTally()}</div>`+cards;
}
function overviewText(x){const v=memory(x.id);return `${aspects().map(a=>`${aspectLabel(a)}：${badge(state(x.id,a))}`).join(' ／ ')} ／ 定着 ${v.streak}回連続${v.due?' ／ 次回 '+v.due:''}`}
function listFields(){return fields.filter(f=>!f.hidden&&f.key!==headKey())}
function editableFields(){return fields.filter(f=>f.type==='text'&&!f.hidden)}
function words(){const head=fieldMap[headKey()],ck=categoryKey(),sk=sectionKey(),shown=listFields();let all=filtered();let list=all.filter(x=>!search||(textOf(x)+(ck?x[ck]??'':'')).includes(search));
 let html=`<div class="panel"><h2 class="heading">${esc(deck.labels.list)}</h2><p class="sub">${esc(joinLabels(shown.map(f=>f.label)))}を確認できます。誤りと思われる項目は「修正」から変更できます。</p><div class="toolbar">${sectionOptions('wordPage')}${categorySelect('wordCategory')}<input id="wordSearch" type="text" placeholder="${esc(deck.labels.item)}を検索" value="${esc(search)}"></div><div class="flex"><button type="button" class="btn small" id="toggleAnswers">${showAnswers?'答えを隠す':'答えを表示'}</button><span class="sub">${groupEntries(list).length}${esc(deck.labels.counter)}を表示</span></div></div><div class="panel" id="wordList">`;
 html+=list.length?groupEntries(list).map(entries=>{const x=entries[0];return `<div class="worditem"><div class="wordhead"><div>${ck?`<span class="tag">${esc(x[ck])}</span> `:''}<span class="wordtitle">${renderValue(head,x[head.key],'list-image')}</span></div></div>${entries.map((o,i)=>`<div class="word-sense"><div class="flex" style="margin-top:8px"><span class="sub grow">${entries.length>1?(i+1)+'　':''}${sk?esc(o[sk]):''}</span>${editableFields().length?`<button class="btn small ghost" data-edit="${o.id}">修正</button>`:''}</div>${showAnswers?`<div class="wordbody">${shown.map((f,n)=>o[f.key]?(n===0&&f.type==='text'?`<b>${esc(o[f.key])}</b>`:renderValue(f,o[f.key],'list-image')):'').filter(Boolean).join('<br>')}</div>`:''}<div class="notice">${esc(overviewText(o))}</div></div>`).join('')}</div>`}).join(''):`<div class="empty">一致する${esc(deck.labels.item)}がありません。</div>`;
 return html+'</div>'
}
function progress(){const list=aspects(),labels=askLabels(),n=list.length,modes=deck.modes;let x=levelCount(),pct=x.all?Math.round(x.master/x.all*100):0,p=learningStore().progress;let seen=Object.entries(p).filter(([k,z])=>belongsToMode(k)&&z.graded>0).map(([,z])=>z);let wrong=seen.reduce((a,b)=>a+b.wrong,0),c=seen.reduce((a,b)=>a+b.mc+b.free,0);let difficult=items().map(x=>({x,wrong:list.reduce((sum,a)=>sum+state(x.id,a).wrong,0)})).filter(o=>o.wrong).sort((a,b)=>b.wrong-a.wrong).slice(0,12);
 const rule=n===1?`${labels[0]}を自力で正解したら定着1回。`:`${joinLabels(labels)}を${n===2?'両方':'すべて'}、自力で正解したら定着1回。`,reset=n===1?'間違えると0回・四択に戻ります。':`${n===2?'どちらか':'どれか'}を間違えると0回・${n===2?'両方':'すべて'}四択に戻ります。`;
 const head=fieldMap[headKey()];
 return stats()+`<div class="panel"><h2 class="heading">定着の進み具合</h2><div class="flex"><strong style="font-size:28px">${pct}%</strong><span class="sub">${x.master} / ${x.all} 項目 定着</span></div><div class="bar"><div style="width:${pct}%"></div></div><p class="sub">${esc(rule)}初回は翌日、2回目は1週間後、3回目以降は1か月後に復習します。同じ日に繰り返しても回数は進みません。${esc(reset)}多義語は語義ごと${modes.length>1?'、'+esc(joinLabels(modes.map(m=>m.label)))+'は別管理':'に管理'}。学習日は日本時間の朝4時に切り替わります。</p><div class="flex"><div class="stat grow"><strong>${c+wrong?Math.round(c/(c+wrong)*100):0}%</strong><span>累計正答率</span></div><div class="stat grow"><strong>${wrong}</strong><span>累計誤答</span></div></div></div><div class="panel"><h2 class="heading">苦手な${esc(deck.labels.item)}</h2>${difficult.length?difficult.map(o=>`<div class="worditem"><b>${renderValue(head,o.x[head.key],'list-image')}</b><span class="item-score">誤答 ${o.wrong} 回</span><div class="sub">${esc(overviewText(o.x))}</div></div>`).join(''):'<p class="sub">まだ誤答の記録はありません。</p>'}</div><div class="panel"><h2 class="heading">データ管理</h2><p class="sub">学習履歴・回答途中の選択・現在の問題は操作ごとに端末内へ自動保存します。再読み込みしても続きから再開できます。別のブラウザやホーム画面のアプリ、別端末には自動同期しません。単語帳ごとに別々に保存されます。</p><div class="flex"><button class="btn small" id="export">学習データ保存</button><label class="btn small" style="cursor:pointer">データを復元<input type="file" id="import" accept="application/json,.json" class="hide"></label><button class="btn small danger" id="reset">学習履歴をリセット</button></div></div>`
}
function render(){updateRecordToggle();document.querySelectorAll('nav button').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));app.innerHTML=tab==='quiz'?quiz():tab==='words'?words():progress();bind();save()}
function bind(){
if(tab==='quiz'){
 bindStudyFilters();document.querySelector('#practiceMode')?.addEventListener('change',e=>switchMode(e.target.value));
 app.querySelectorAll('[data-example]').forEach(button=>button.addEventListener('click',()=>{answers['_example_'+button.dataset.example]=!answers['_example_'+button.dataset.example];render()}));
 document.querySelector('#pageSelect')?.addEventListener('change',e=>{page=e.target.value;category='すべて';changeScope()});
 document.querySelector('#categorySelect')?.addEventListener('change',e=>{category=e.target.value;changeScope()});
 document.querySelector('#orderSelect')?.addEventListener('change',e=>{orderMode=e.target.value;changeScope()});
 document.querySelector('#reshuffle')?.addEventListener('click',changeScope);
 document.querySelector('#restart')?.addEventListener('click',restartPractice);
 app.querySelectorAll('[data-question]').forEach(bindQuestion);
}else if(tab==='words'){
 document.querySelector('#wordPage')?.addEventListener('change',e=>{page=e.target.value;category='すべて';newBatch();render()});
 document.querySelector('#wordCategory')?.addEventListener('change',e=>{category=e.target.value;newBatch();render()});
 document.querySelector('#wordSearch')?.addEventListener('input',e=>{search=e.target.value;let at=e.target.selectionStart;render();let inp=document.querySelector('#wordSearch');inp.focus();inp.setSelectionRange(at,at)});
 document.querySelector('#toggleAnswers')?.addEventListener('click',()=>{showAnswers=!showAnswers;render()});
 app.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>openEdit(+el.dataset.edit)));
}else{
 document.querySelector('#export')?.addEventListener('click',exportData);
 document.querySelector('#import')?.addEventListener('change',importData);
 document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm(`学習履歴をすべてリセットしますか？ ${deck.labels.item}の修正は残します。`)){const root=learningStore();for(const k of Object.keys(root.progress))if(belongsToMode(k))delete root.progress[k];if(root.study)delete root.study[practiceMode];answers={};results={};newBatch();render()}});
}}
function applyGrade(s,correct,{method=s.level==='choice'?'choice':'recall',day=today()}={}){if(correct){if(method==='choice')s.mc++;else{s.free++;s.streak++}s.level='recall'}else{s.wrong++;s.streak=0;s.level='choice';s.firstFreeDay='';s.laterHit=false}s.last=day;s.graded++}
function override(k){if(refreshStudyDay())return;const r=results[k],parts=questionKey(k);if(!r||!parts)return;const want=!r.correct,[id,a]=parts,j=journal(id,true),event=j.events.find(e=>e.id===r.eventId);if(event){event.correct=want;replayStudy(id)}else{const s=clone(r.before);applyGrade(s,want);j.base[a]=s;replayStudy(id)}r.correct=want;const history=learningStore().history[r.historyIndex];if(history)history.correct+=want?1:-1;refreshQuestion(k)}
function openEdit(id){editId=id;const x=item(id);document.querySelector('#editTitle').textContent=deck.labels.item+'を修正';document.querySelector('#editFields').innerHTML=editableFields().map(f=>`<label for="edit-${f.key}">${esc(f.label)}</label><input id="edit-${f.key}" data-field="${f.key}" type="text" required value="${esc(x[f.key])}">`).join('');document.querySelector('#editor').showModal()}
document.querySelector('#editCancel').addEventListener('click',()=>document.querySelector('#editor').close());
document.querySelector('#editForm').addEventListener('submit',e=>{if(e.submitter?.value!=='save')return;const edit={};for(const input of document.querySelectorAll('#editFields input')){const v=input.value.trim();if(!v){e.preventDefault();alert('すべて入力してください');return}edit[input.dataset.field]=v}store.edits[editId]=edit;save();render()});
function exportData(){const blob=new Blob([JSON.stringify({version:1,deck:deck.id,store},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=deck.title+'_バックアップ_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){let file=e.target.files?.[0];if(!file)return;file.text().then(s=>{let v=JSON.parse(s);if(v.version!==1||!v.store?.progress||!v.store?.edits)throw Error('対応しないデータ');if(v.deck&&v.deck!==deck.id)throw Error(`別の単語帳（${v.deck}）のデータです。単語帳を切り替えてから復元してください`);if(confirm(`「${deck.title}」の学習データを読み込んだデータに置き換えますか？`)){store=prepareStore(v.store);initializeStudy();recording=store.settings.recording!==false;sandbox=recording?null:clone(store);scratchSessions={};activeDay=today();practiceMode=validMode(store.practiceMode);migrateCards();answers={};results={};if(!restoreSession())newBatch();render()}}).catch(err=>alert('読み込みに失敗しました：'+err.message))}

// ---------- decks ----------
function storedDeckId(){try{return localStorage.getItem(DECK_KEY)}catch(e){return null}}
function renderDeckSlot(){const slot=document.querySelector('#deckSlot');if(!slot)return;
 if(deckList.length>1){slot.innerHTML=`<select id="deckSelect" class="deck-select" aria-label="単語帳">${deckList.map(d=>`<option value="${esc(d.id)}" ${d.id===deck?.id?'selected':''}>${esc(d.title)}</option>`).join('')}</select>`;slot.querySelector('#deckSelect').addEventListener('change',e=>switchDeck(e.target.value))}
 else slot.textContent=deck?.description||deck?.title||'';
}
function switchDeck(id){if(deck&&id===deck.id)return;save();try{localStorage.setItem(DECK_KEY,id)}catch(e){}location.reload()}
async function fetchJson(url){const response=await fetch(url);if(!response.ok)throw Error(url+' を読み込めません（'+response.status+'）');return response.json()}
function showFatal(message){app.innerHTML=`<div class="panel"><h2 class="heading">単語帳を開けません</h2><p class="sub">${esc(message)}</p>${deckList.length>1?'<p class="sub">右上から別の単語帳を選べます。</p>':''}</div>`;renderDeckSlot()}
async function start(){app.innerHTML='<div class="panel sub">学習データを読み込み中…</div>';
 try{const list=await fetchJson('decks/index.json');deckList=(list.decks||[]).filter(d=>d&&d.id&&d.file)}catch(e){showFatal('単語帳の一覧（decks/index.json）を読み込めませんでした。'+e.message);return}
 const entry=deckList.find(d=>d.id===storedDeckId())||deckList[0];
 if(!entry){showFatal('単語帳がありません。');return}
 try{deck=prepareDeck(await fetchJson('decks/'+entry.file));if(deck.id!==entry.id)throw Error('decks/index.json と '+entry.file+' の id が一致しません')}catch(e){deck=null;showFatal(entry.title+'：'+e.message);return}
 setupDeck();store=load();
 try{const backup=await readBackup();if(validStore(backup)&&(!localLoaded||(backup.savedAt||0)>(store.savedAt||0))){store=prepareStore(backup);localLoaded=true}}catch(e){}
 practiceMode=validMode(store.practiceMode);migrateCards();initializeStudy();recording=store.settings.recording!==false;if(!recording)sandbox=clone(store);activeDay=today();const scroll=Number(store.session?.scrollY)||0,restored=restoreSession();if(!restored)newBatch();ready=true;render();
 if(restored)requestAnimationFrame(()=>window.scrollTo({top:scroll,behavior:'instant'}));
 if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});
}
document.querySelectorAll('nav button').forEach(x=>x.addEventListener('click',()=>{if(!ready)return;tab=x.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'})}));
// Persist before iOS suspends the page; there is no automatic reload.
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();else if(ready)refreshStudyDay()});
setInterval(()=>{if(ready&&document.visibilityState!=='hidden')refreshStudyDay()},30000);
let scrollTimer;window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>save(),250)},{passive:true});
if('serviceWorker' in navigator && location.protocol==='https:'){
 navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;updateSaveStatus()}).catch(()=>{});
}
document.querySelector('#recordToggle').addEventListener('click',()=>{if(ready)switchRecording()});
start();
})();
</script></body></html>
