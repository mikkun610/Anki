  "44": {"text":"室中{{}}人。","translation":"部屋の中には人がいない。","source":"自作（学習用）","kakikudashi":"室中、人なし。","reading":"なシ","meaning":"〜がいない","forms":{"莫":{"text":"{{}}知此事。","kakikudashi":"此の事を知る者なし。","translation":"このことを知る者はいない。","meaning":"〜する者がいない"},"勿":{"text":"愛之、能{{}}労乎。","kakikudashi":"之を愛して、能く労すること勿からんや。","translation":"その人を大切に思うなら、苦労させずにいられるだろうか。","meaning":"〜しない","source":"『論語』憲問","url":"https://ja.wikisource.org/wiki/%E8%AB%96%E8%AA%9E_(%E5%9C%8B%E8%AD%AF%E6%BC%A2%E6%96%87%E5%A4%A7%E6%88%90)/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B"}}},
  "45": {"text":"{{}}忘父母。","translation":"父母を忘れてはならない。","source":"自作（学習用）","kakikudashi":"父母を忘るることなかれ。","reading":"なカレ","meaning":"〜してはいけない"},
  "46": {"text":"{{}}筆書字。","translation":"筆で文字を書く。","source":"自作（学習用）","kakikudashi":"筆を以て字を書く。","reading":"もツテ","meaning":"〜を使って"},
  "47": {"text":"{{}}貧、不失志。","translation":"貧しくても志を失わない。","source":"自作（学習用）","kakikudashi":"貧しと雖も、志を失はず。","reading":"〜トいへどモ","meaning":"〜であっても"},
  "48": {"text":"王問其故、臣{{}}告之。","translation":"王が理由を尋ねた。そこで家臣はそれを告げた。","source":"自作（学習用）","kakikudashi":"王、其の故を問ひ、臣、因りて之を告ぐ。","reading":"よりテ","meaning":"そこで"},
  "49": {"text":"雨甚、{{}}不行。","translation":"雨が激しいので、出かけない。","source":"自作（学習用）","kakikudashi":"雨甚だし、故に行かず。","reading":"ゆゑニ","meaning":"だから"},
  "50": {"text":"{{}}衆皆去。","translation":"そこで人々はみな去った。","source":"自作（学習用）","kakikudashi":"是に於いて衆皆去る。","reading":"ここニおイテ","meaning":"そこで"},
  "51": {"text":"{{}}吾知其賢。","translation":"こういうわけで私は彼が賢いと分かる。","source":"自作（学習用）","kakikudashi":"ここを以て吾、其の賢なるを知る。","reading":"ここヲもつテ","meaning":"こういうわけで"},
  "52": {"text":"観其行、{{}}知其心。","translation":"その人の行いを見て、これによってその心を知る。","source":"自作（学習用）","kakikudashi":"其の行ひを観て、これを以て其の心を知る。","reading":"これヲもつテ","meaning":"これによって"},
  "53": {"text":"学成、{{}}帰。","translation":"学問を修め、その後で帰る。","source":"自作（学習用）","kakikudashi":"学成り、然る後に帰る。","reading":"しかルのちニ","meaning":"その後で"},
  "54": {"text":"{{}}何為。","translation":"そうだとすれば、どうするのか。","source":"自作（学習用）","kakikudashi":"然らば則ち何をか為さん。","reading":"しかラバすなはチ","meaning":"そうだとすれば"},
  "55": {"text":"言善、{{}}行悪。","translation":"言葉は善いのに、行いは悪い。","source":"自作（学習用）","kakikudashi":"言は善し、然るに行ひは悪し。","reading":"しかルニ","meaning":"それなのに"},
  "56": {"text":"聞之、{{}}起。","translation":"それを聞くと、そこで立ち上がった。","source":"自作（学習用）","kakikudashi":"之を聞き、すなはち起つ。","reading":"すなはチ","meaning":"そこで"},
  "57": {"text":"学{{}}思。","translation":"学んで、そして考える。","source":"自作（学習用）","kakikudashi":"学び、しかうして思ふ。","reading":"しかうシテ","meaning":"そして"},
  "58": {"text":"貧{{}}好学。","translation":"貧しいけれども学問を好む。","source":"自作（学習用）","kakikudashi":"貧し、しかれども学を好む。","reading":"しかレドモ","meaning":"けれども"},
  "59": {"text":"人皆去、{{}}我独留。","translation":"人々はみな去ったが、私は一人とどまった。","source":"自作（学習用）","kakikudashi":"人皆去る、而るに我独り留まる。","reading":"しかルニ","meaning":"けれども"},
  "60": {"text":"欲進{{}}不能。","translation":"進みたいが、進めない。","source":"自作（学習用）","kakikudashi":"進まんと欲す、しかも能はず。","reading":"しかモ","meaning":"けれども"},
  "61": {"text":"聞過{{}}改。","translation":"過ちを聞くとすぐに改める。","source":"自作（学習用）","kakikudashi":"過ちを聞けば則ち改む。","reading":"すなはチ","meaning":"すぐに"},
  "62": {"text":"学而時習之、不{{}}説乎。","translation":"学んで折にふれて復習するのは、やはりうれしいことではないか。","source":"論語・学而（字体を調整）","url":"https://ctext.org/analects/xue-er","kakikudashi":"学びて時に之を習ふ、亦た説ばしからずや。","reading":"まタ","meaning":"やはり"},
  "63": {"text":"故人{{}}来。","translation":"旧友が再び来る。","source":"自作（学習用）","kakikudashi":"故人、復た来たる。","reading":"まタ","meaning":"再び"},
  "64": {"text":"{{}}止於此。","translation":"少しの間ここにとどまる。","source":"自作（学習用）","kakikudashi":"暫く此に止まる。","reading":"しばらク","meaning":"少しの間"},
  "65": {"text":"久学、{{}}成業。","translation":"長く学んで、とうとう成し遂げた。","source":"自作（学習用）","kakikudashi":"久しく学び、遂に業を成す。","reading":"つひニ","meaning":"とうとう"},
  "66": {"text":"衆人議之、事{{}}定。","translation":"人々が議論し、とうとうその件が決まった。","source":"自作（学習用）","kakikudashi":"衆人、之を議し、事つひに定まる。","reading":"つひニ","meaning":"とうとう"},
  "67": {"text":"{{}}有暇、則来。","translation":"もし暇があるなら、来なさい。","source":"自作（学習用）","kakikudashi":"もし暇有らば、則ち来たれ。","reading":"もシ〜バ","meaning":"もし〜なら"},
  "68": {"text":"{{}}費日月。","translation":"むだに月日を費やす。","source":"自作（学習用）","kakikudashi":"徒らに日月を費やす。","reading":"いたづらニ","meaning":"むだに"},
  "69": {"text":"衆人{{}}言其志。","translation":"人々がそれぞれ自分の志を述べる。","source":"自作（学習用）","kakikudashi":"衆人、おのおの其の志を言ふ。","reading":"おのおの","meaning":"それぞれ"},
  "70": {"text":"賓主{{}}相勧酒。","translation":"客と主人が交互に酒を勧め合う。","source":"自作（学習用）","kakikudashi":"賓主、交も相ひ酒を勧む。","reading":"こもごも","meaning":"交互に"},
  "71": {"text":"故人{{}}来訪。","translation":"旧友がしばしば訪ねて来る。","source":"自作（学習用）","kakikudashi":"故人、数しば来訪す。","reading":"しばしば","meaning":"しばしば"},
  "72": {"text":"{{}}遇故人。","translation":"たまたま旧友に出会った。","source":"自作（学習用）","kakikudashi":"たまたま故人に遇ふ。","reading":"たまたま","meaning":"偶然"},
  "73": {"text":"{{}}読此書。","translation":"必ずこの本を読む必要がある。","source":"自作（学習用）","kakikudashi":"須らく此の書を読むべし。","reading":"すべからク〜べシ","meaning":"〜する必要がある"},
  "74": {"text":"衆皆去、吾{{}}留。","translation":"人々はみな去り、私だけがとどまる。","source":"自作（学習用）","kakikudashi":"衆皆去り、吾独り留まる。","reading":"ひとリ","meaning":"ただ一人"},
  "75": {"text":"此{{}}一技耳。","translation":"これはただ一つの技にすぎない。","source":"自作（学習用）","kakikudashi":"此れ直だ一技のみ。","reading":"たダ","meaning":"ただ"},
  "76": {"text":"吾{{}}知其名耳。","translation":"私はただその名前を知っているだけだ。","source":"自作（学習用）","kakikudashi":"吾ただ其の名を知るのみ。","reading":"たダ","meaning":"ただ"},
  "77": {"text":"此事{{}}可忘乎。","translation":"この事をどうして忘れてよいだろうか。","source":"自作（学習用）","kakikudashi":"此の事、いづくんぞ忘るべけんや。","reading":"いづクンゾ","meaning":"どうして〜か"},
  "78": {"text":"{{}}知其心。","translation":"どうしてその心が分かるだろうか。いや、分からない。","source":"自作（学習用）","kakikudashi":"いづくんぞ其の心を知らん。","reading":"いづクンゾ","meaning":"どうして〜か"},
  "79": {"text":"{{}}有此人。","translation":"どこにこの人がいるのか。","source":"自作（学習用）","kakikudashi":"何れの処にか此の人有る。","reading":"いづレノところニか","meaning":"どこに〜か"},
  "80": {"text":"{{}}知其故。","translation":"だれがその理由を知っているか。","source":"自作（学習用）","kakikudashi":"たれか其の故を知る。","reading":"たれカ","meaning":"誰が〜か"},
  "81": {"text":"二人{{}}賢。","translation":"二人のうち、どちらが賢いか。","source":"自作（学習用）","kakikudashi":"二人、いづれか賢なる。","reading":"いづレカ","meaning":"どちらが〜か"},
  "82": {"text":"其数{{}}。","translation":"その数はどれほどか。","source":"自作（学習用）","kakikudashi":"其の数、いくばくぞ。","reading":"いくばくゾ","meaning":"どれほどか"},
  "83": {"text":"{{}}而可。","translation":"どうすればよいか。","source":"自作（学習用）","kakikudashi":"いかんしてか可ならん。","reading":"いかん","meaning":"どうすればよいか"},
  "84": {"text":"此人{{}}。","translation":"この人はどのような人か。","source":"自作（学習用）","kakikudashi":"此の人、いかん。","reading":"いかん","meaning":"どのようか"},
  "85": {"text":"客{{}}読書。","translation":"客はちょうど読書している。","source":"自作（学習用）","kakikudashi":"客、方に読書す。","reading":"まさニ","meaning":"ちょうど"},
  "86": {"text":"其名{{}}聞於国中。","translation":"その名は国中に広く知られる。","source":"自作（学習用）","kakikudashi":"其の名、遍く国中に聞こゆ。","reading":"あまねク","meaning":"広く"},
  "87": {"text":"衆人{{}}去。","translation":"人々はすべて去った。","source":"自作（学習用）","kakikudashi":"衆人、尽く去る。","reading":"ことごとク","meaning":"すべて"},
  "88": {"text":"客{{}}言其事。","translation":"客がその事を詳しく述べる。","source":"自作（学習用）","kakikudashi":"客、つぶさに其の事を言ふ。","reading":"つぶさニ","meaning":"詳しく"},
  "89": {"text":"少者亦{{}}学。","translation":"若い者も学ぶことができる。","source":"自作（学習用）","kakikudashi":"少き者も亦能く学ぶ。","reading":"よク","meaning":"〜できる"},
  "90": {"text":"此吾之所{{}}知也。","translation":"これは私がもともと知っていることだ。","source":"自作（学習用）","kakikudashi":"此れ吾の固より知る所なり。","reading":"もとヨリ","meaning":"もともと"},
  "91": {"text":"{{}}有志、事可成。","translation":"もし仮にも志があれば、事は成し遂げられる。","source":"自作（学習用）","kakikudashi":"苟くも志有らば、事成るべし。","reading":"いやしくモ〜バ","meaning":"もし〜なら"},
  "92": {"text":"{{}}告其友。","translation":"ひそかに友人に告げる。","source":"自作（学習用）","kakikudashi":"私かに其の友に告ぐ。","reading":"ひそかニ","meaning":"ひそかに"},
  "93": {"text":"吾{{}}国尽力。","translation":"私は国のために力を尽くす。","source":"自作（学習用）","kakikudashi":"吾、国の為に力を尽くす。","reading":"ためニ","meaning":"〜のために"},
  "94": {"text":"{{}}見故人。","translation":"たまたま旧友を見かける。","source":"自作（学習用）","kakikudashi":"たまたま故人を見る。","reading":"たまたま","meaning":"偶然"},
  "95": {"text":"山路{{}}険。","translation":"山道はひどく険しい。","source":"自作（学習用）","kakikudashi":"山路、甚だ険し。","reading":"はなはダ","meaning":"ひどく"},
  "96": {"text":"吾不{{}}妄言。","translation":"私は進んででたらめを言おうとはしない。","source":"自作（学習用）","kakikudashi":"吾、肯へて妄言せず。","reading":"あへテ","meaning":"進んで〜する"},
  "97": {"text":"{{}}有大雨、吾必往。","translation":"たとえ大雨が降っても、私は必ず行く。","source":"自作（学習用）","kakikudashi":"縦ひ大雨有るとも、吾必ず往かん。","reading":"たとヒ〜トモ","meaning":"たとえ〜としても"},
  "98": {"text":"{{}}其人賢矣。","translation":"思うに、その人は賢いのだろう。","source":"自作（学習用）","kakikudashi":"蓋し其の人、賢ならん。","reading":"けだシ","meaning":"思うに"},
  "99": {"text":"朋友尚不可欺、{{況父母乎}}。","translation":"友人でさえだましてはならない。まして親をだましてはならない。","source":"自作（学習用）","kakikudashi":"朋友すら尚ほ欺くべからず、況んや父母をや。","reading":"いはンヤふぼヲや","meaning":"まして父母はなおさらだ"},
  "100": {"text":"草木{{}}生。","translation":"草木は自然に生える。","source":"自作（学習用）","kakikudashi":"草木、おのづから生ず。","reading":"おのづから","meaning":"自然に"},
  "101": {"text":"王{{}}往。","translation":"王が自分から出向く。","source":"自作（学習用）","kakikudashi":"王、みづから往く。","reading":"みづから","meaning":"自分で"},
  "102": {"text":"客{{}}去。","translation":"客はすでに去った。","source":"自作（学習用）","kakikudashi":"客、已に去る。","reading":"すでニ","meaning":"すでに"},
  "103": {"text":"{{}}日暮。","translation":"やがて日が暮れた。","source":"自作（学習用）","kakikudashi":"已にして日暮る。","reading":"すでニシテ","meaning":"やがて"},
  "104": {"text":"{{}}学問者、不可怠也。","translation":"そもそも学問というものは、怠ってはいけない。","source":"自作（学習用）","kakikudashi":"夫れ学問は、怠るべからざるなり。","reading":"そレ","meaning":"そもそも"},
  "105": {"text":"吾{{}}遊此地。","translation":"私は以前、この地を訪れたことがある。","source":"自作（学習用）","kakikudashi":"吾、嘗て此の地に遊ぶ。","reading":"かつテ","meaning":"以前"},
  "106": {"text":"美{{}}、此山。","translation":"美しいなあ、この山は。","source":"自作（学習用）","kakikudashi":"美しいかな、此の山。","reading":"かな","meaning":"〜だなあ","forms":{"邪":{"text":"此山美{{}}。","kakikudashi":"此の山、美しきか。","translation":"この山は美しいか。","reading":"か","meaning":"〜か"}}},
  "107": {"text":"吾知其名{{}}。","translation":"私はその名前を知っているだけだ。","source":"自作（学習用）","kakikudashi":"吾、其の名を知るのみ。","reading":"のみ","meaning":"〜だけだ"},
  "108": {"text":"客{{}}東来。","translation":"客が東から来る。","source":"自作（学習用）","kakikudashi":"客、東より来たる。","reading":"より","meaning":"〜から"},
  "109": {"text":"此{{}}彼等。","translation":"これはあれと等しい。","source":"自作（学習用）","kakikudashi":"此れ彼と等し。","reading":"と","meaning":"〜と"},
  "110": {"text":"{{与其}}多言、寧黙。","translation":"多くを語るよりは、むしろ黙っていよう。","source":"自作（学習用）","kakikudashi":"其の多言せんよりは、寧ろ黙せん。","reading":"そノ〜ンよリハ","meaning":"〜するよりは"},
  "111": {"text":"孝{{}}、徳之本也。","translation":"親孝行は、徳の根本である。","source":"自作（学習用）","kakikudashi":"孝は、徳の本なり。","reading":"〜は","meaning":"〜は"},
  "112": {"text":"夜有灯、{{}}読書。","translation":"夜でも明かりがあれば、書物を読むことができる。","source":"自作（学習用）","kakikudashi":"夜に灯有らば、書を読むべし。","reading":"べシ","meaning":"〜できる"},
  "113": {"text":"此事{{}}忘。","translation":"この事は忘れてはならない。","source":"自作（学習用）","kakikudashi":"此の事は忘るべからず。","reading":"べカラず","meaning":"〜してはならない"},
  "114": {"text":"其心{{}}石。","translation":"その心は石のようだ。","source":"自作（学習用）","kakikudashi":"其の心は石のごとし。","reading":"〜ノごとシ","meaning":"〜のようだ"},
  "115": {"text":"此{{}}吾物。","translation":"これは私の物ではない。","source":"自作（学習用）","kakikudashi":"此れ吾が物にあらず。","reading":"〜ニあらズ","meaning":"〜ではない"},
  "116": {"text":"此吾師{{}}。","translation":"これは私の先生である。","source":"自作（学習用）","kakikudashi":"此れ吾が師なり。","reading":"なり","meaning":"〜である"},
  "117": {"text":"忠臣{{}}疑。","translation":"忠臣が疑われる。","source":"自作（学習用）","kakikudashi":"忠臣、疑はる。","reading":"る・らル","meaning":"〜される"},
  "118": {"text":"王{{}}臣往。","translation":"王が家臣を行かせる。","source":"自作（学習用）","kakikudashi":"王、臣をして往かしむ。","reading":"〜ヲシテ〜しム","meaning":"〜に〜させる"},
  "119": {"text":"富者{{}}賢。","translation":"金持ちが必ずしも賢いとは限らない。","source":"自作（学習用）","kakikudashi":"富める者、必ずしも賢ならず。","reading":"かならズシモ〜ず","meaning":"必ず〜とは限らない"},
  "120": {"text":"吾{{}}忘此恩。","translation":"私はこの恩を決して忘れない。","source":"自作（学習用）","kakikudashi":"吾、必ず此の恩を忘れず。","reading":"かならズ〜ず","meaning":"決して〜ない"},
  "121": {"text":"天{{}}晴。","translation":"空は常に晴れているとは限らない。","source":"自作（学習用）","kakikudashi":"天、常には晴れず。","reading":"つねニハ〜ず","meaning":"いつも〜とは限らない"},
  "122": {"text":"此人{{}}読書。","translation":"この人は普段から読書をしない。","source":"自作（学習用）","kakikudashi":"此の人、常に読書せず。","reading":"つねニ〜ず","meaning":"いつも〜しない"},
  "123": {"text":"吾{{}}彼。","translation":"私は彼には及ばない。","source":"自作（学習用）","kakikudashi":"吾、彼にしかず。","reading":"〜ニしかず","meaning":"〜に及ばない"},
  "124": {"text":"国中{{}}此人。","translation":"国中にこの人に及ぶ者はいない。","source":"自作（学習用）","kakikudashi":"国中、此の人にしくはなし。","reading":"〜ニしくハなシ","meaning":"〜に及ぶものはない"},
  "125": {"text":"{{}}勤学。","translation":"熱心に学ぶことに及ぶものはない。","source":"自作（学習用）","kakikudashi":"勤学にしくはなし。","reading":"〜ニしくハなシ","meaning":"〜に及ぶものはない"},
  "126": {"text":"吾{{}}忘恩。","translation":"私は決して恩を忘れない。","source":"自作（学習用）","kakikudashi":"吾、敢へて恩を忘れず。","reading":"あへテ〜ず","meaning":"決して〜しない"},
  "127": {"text":"受恩而{{}}報乎。","translation":"恩を受けて、どうして報いないことがあろうか。","source":"自作（学習用）","kakikudashi":"恩を受けて敢へて報いざらんや。","reading":"あへテ〜ざランヤ","meaning":"どうして〜しないことがあろうか"},
  "128": {"text":"雨甚、{{}}行。","translation":"雨が激しく、行くことができない。","source":"自作（学習用）","kakikudashi":"雨甚だしく、行くを得ず。","reading":"〜ヲえず","meaning":"〜できない"},
  "129": {"text":"聞之、{{}}悲。","translation":"それを聞き、悲しみに堪えない。","source":"自作（学習用）","kakikudashi":"之を聞き、悲しみに勝へず。","reading":"〜ニたへず","meaning":"〜に堪えられない"},
  "130": {"text":"吾{{}}此人賢。","translation":"私はこの人を賢いと思う。","source":"自作（学習用）","kakikudashi":"吾、おもへらく、此の人は賢なりと。","reading":"おもへラク","meaning":"〜と思う"},
  "131": {"text":"此{{}}良友也。","translation":"これは、いわゆるよい友である。","source":"自作（学習用）","kakikudashi":"此れ所謂良友なり。","reading":"いはゆる","meaning":"いわゆる"},
  "132": {"text":"家{{}}米。","translation":"家に米がないわけではない。","source":"自作（学習用）","kakikudashi":"家に米無きにあらず。","reading":"〜なキニあらズ","meaning":"〜がないわけではない"},
  "133": {"text":"吾{{}}知其事。","translation":"私はその事を知らないわけではない。","source":"自作（学習用）","kakikudashi":"吾、其の事を知らざるにあらず。","reading":"〜セざルニあらズ","meaning":"〜しないわけではない"},
  "134": {"text":"此地之人{{}}善人。","translation":"この地の人は、善人でない者はいない。","source":"自作（学習用）","kakikudashi":"此の地の人、善人にあらざるはなし。","reading":"〜ニあらザルはなシ","meaning":"〜でない者はいない"},
  "135": {"text":"衆人{{}}知之。","translation":"人々のうち、それを知らない者はいない。","source":"自作（学習用）","kakikudashi":"衆人、之を知らざるはなし。","reading":"〜セざルはなシ","meaning":"〜しない者はいない"},
  "136": {"text":"吾{{}}知其名。","translation":"私はまだその名前を知らない。","source":"自作（学習用）","kakikudashi":"吾、未だ其の名を知らず。","reading":"いまダ〜ず","meaning":"まだ〜ない"},
  "137": {"text":"故人{{}}来。","translation":"旧友はきっと来るだろう。","source":"自作（学習用）","kakikudashi":"故人、応に来たるべし。","reading":"まさニ〜べシ","meaning":"きっと〜だろう"},
  "138": {"text":"学者{{}}勤。","translation":"学ぶ者は当然、勤勉であるべきだ。","source":"自作（学習用）","kakikudashi":"学者、当に勤むべし。","reading":"まさニ〜べシ","meaning":"当然〜すべきだ"},
  "139": {"text":"日{{}}暮。","translation":"日は今まさに暮れようとしている。","source":"自作（学習用）","kakikudashi":"日、将に暮れんとす。","reading":"まさニ〜ントす","meaning":"今〜しようとしている"},
  "140": {"text":"雨{{}}至。","translation":"雨が今にも降りそうである。","source":"自作（学習用）","kakikudashi":"雨、且に至らんとす。","reading":"まさニ〜ントす","meaning":"今にも〜しそうだ"},
  "141": {"text":"汝{{}}早帰。","translation":"お前は早く帰るのがよい。","source":"自作（学習用）","kakikudashi":"汝、宜しく早く帰るべし。","reading":"よろシク〜べシ","meaning":"〜するのがよい"},
  "142": {"text":"学者{{}}勤。","translation":"学ぶ者は努力する必要がある。","source":"自作（学習用）","kakikudashi":"学者、須らく勤むべし。","reading":"すべからク〜べシ","meaning":"〜する必要がある"},
  "143": {"text":"人生{{}}朝露。","translation":"人生はちょうど朝露のようだ。","source":"自作（学習用）","kakikudashi":"人生、猶ほ朝露のごとし。","reading":"なホ〜ノごとシ","meaning":"ちょうど〜のようだ"},
  "144": {"text":"過{{}}不及。","translation":"行き過ぎは、ちょうど足りないことと同じだ。","source":"自作（学習用）","kakikudashi":"過ぎたるは由ほ及ばざるがごとし。","reading":"なホ〜ガごとシ","meaning":"ちょうど〜のようだ"},
  "145": {"text":"{{}}言其志。","translation":"どうしてその志を言わないのか。","source":"自作（学習用）","kakikudashi":"盍ぞ其の志を言はざる。","reading":"なんゾ〜ざル","meaning":"どうして〜しないのか"},
  "146": {"text":"遇此難、{{}}。","translation":"この困難に遭って、どうすればよいか。","source":"自作（学習用）","kakikudashi":"此の難に遇ひ、いかんせん。","reading":"いかんセン","meaning":"どうしたらよいか"},
  "147": {"text":"事勢{{}}。","translation":"物事の様子はこのようである。","source":"自作（学習用）","kakikudashi":"事勢、かくのごとし。","reading":"かくノごとシ","meaning":"このようだ"},
  "148": {"text":"忠臣{{為王所疑}}。","translation":"忠臣が王に疑われる。","source":"自作（学習用）","kakikudashi":"忠臣、王の疑ふ所と為る。","reading":"おうノうたがフところトなル","meaning":"王に疑われる"},
  "149": {"text":"{{賢者{v}不能}}、況愚者乎。","translation":"賢い人でさえできない。まして愚かな人にはできない。","source":"自作（学習用）","kakikudashi":"賢者すら{kana}能はず、況んや愚者をや。","reading":"けんじゃスラかツあたハず","meaning":"賢者でさえできない","forms":{"A尚B":{"reading":"けんじゃスラなホあたハず"}}},
  "150": {"text":"兄尚不能、{{況弟乎}}。","translation":"兄でさえできない。まして弟にはできない。","source":"自作（学習用）","kakikudashi":"兄すら尚ほ能はず、況んや弟をや。","reading":"いはンヤおとうとヲや","meaning":"まして弟はなおさらだ"},
  "151": {"text":"{{}}、道之難也。","translation":"ああ、道を実践するのは難しいものだ。","source":"自作（学習用）","kakikudashi":"ああ、道の難きや。","reading":"ああ","meaning":"ああ"},
  "152": {"text":"{{}}、事已遅矣。","translation":"ああ、事はもう手遅れだ。","source":"自作（学習用）","kakikudashi":"ああ、事已に遅し。","reading":"ああ","meaning":"ああ"},
  "153": {"text":"{{}}、政成。","translation":"一年たたないうちに政治が整った。","source":"自作（学習用）","kakikudashi":"期年ならずして、政成る。","reading":"きねんナラずシテ","meaning":"一年たたないうちに"},
  "154": {"text":"{{}}人吾友也。","translation":"あの人は私の友である。","source":"自作（学習用）","kakikudashi":"かの人、吾が友なり。","reading":"かノ","meaning":"あの"},
  "155": {"text":"吾聞{{}}。","translation":"私はそれを聞いた。","source":"自作（学習用）","kakikudashi":"吾、これを聞く。","reading":"これヲ","meaning":"これを"},
  "156": {"text":"{{甲孰与乙}}賢。","translation":"甲と乙ではどちらが賢いか。","source":"自作（学習用）","kakikudashi":"甲は乙に孰れぞ賢なる。","reading":"かふハおつニいづレゾ","meaning":"甲と乙ではどちらが〜か"},
  "157": {"text":"此人{{}}也。","translation":"この人は秦の国の人である。","source":"自作（学習用）","kakikudashi":"此の人は秦人なり。","reading":"しんひと","meaning":"秦の国の人"},
  "158": {"text":"{{}}吾帰。","translation":"今、私は帰る。","source":"自作（学習用）","kakikudashi":"今、吾帰る。","reading":"いま","meaning":"今"},
  "159": {"text":"{{}}吾居此。","translation":"昔、私はここに住んでいた。","source":"自作（学習用）","kakikudashi":"昔、吾此に居る。","reading":"むかし","meaning":"昔"},
  "160": {"text":"父志在学、子志{{}}。","translation":"父は学問を志し、子も同じように志す。","source":"自作（学習用）","kakikudashi":"父の志は学に在り、子の志もかくのごとし。","reading":"かくノごとシ","meaning":"このようだ","forms":{"若其":{"text":"子之志{{若其父}}。","kakikudashi":"子の志は其の父のごとし。","translation":"子の志はその父の志に似ている。","reading":"そノちちノごとシ","meaning":"その父のようだ"}}},
  "161": {"text":"父勤学、子亦{{}}。","translation":"父が熱心に学び、子も同じように学ぶ。","source":"自作（学習用）","kakikudashi":"父、勤学し、子も亦たかくのごとし。","reading":"かくノごとシ","meaning":"このようだ"},
  "162": {"text":"父好学、子亦{{}}。","translation":"父が学問を好み、子も同じように好む。","source":"自作（学習用）","kakikudashi":"父、学を好み、子も亦たかくのごとし。","reading":"かくノごとシ","meaning":"このようだ","forms":{"如其":{"text":"子之志{{如其父}}。","kakikudashi":"子の志は其の父のごとし。","translation":"子の志はその父の志に似ている。","reading":"そノちちノごとシ","meaning":"その父のようだ"}}}
}</script>
<script>
(()=>{'use strict';
const key='kanbun_simple_v1_20261027';
const seed=JSON.parse(document.querySelector('#seed').textContent);
function cardForms(word){const expanded=String(word).replace('A且（尚）B','A且B・A尚B');return [...new Set(expanded.replace(/（[^）]*）|\([^)]*\)|[①-⑳]/g,'').split('・').map(w=>w.trim()).filter(Boolean))]}
let nextCardId=seed.length;
const data=seed.flatMap((a,i)=>cardForms(a[2]).map((word,index)=>({id:index===0?i+1:++nextCardId,sourceId:i+1,partIndex:index,sourceWord:a[2],side:a[0],group:a[1],word,reading:a[3].replace('（国名）',''),meaning:a[4]})));
let ready=false, localLoaded=false, savedLocally=false, offlineReady=false, storageWarning=false, saveRevision=0, mirrorWrites=Promise.resolve(), dbPromise=null;
let store=load(), practiceMode=store.practiceMode==='example'?'example':'word', tab='quiz', page='すべて', category='すべて', search='', batch=[], results={}, answers={}, showAnswers=true, orderMode='ordered', editId=null, quizFilters=cleanFilters(store.settings?.quiz?.filters), recording=store.settings?.recording!==false, sandbox=null, scratchSessions={}, activeDay='';
const app=document.querySelector('#app');
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const today=()=>learningDay();
function learningStore(){return recording?store:sandbox||store}
function clone(value){return JSON.parse(JSON.stringify(value))}
function learningDay(time=Date.now()){return new Date(time+5*3600000).toISOString().slice(0,10)}
function addDays(day,n){const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function addMonth(day){const d=new Date(day+'T12:00:00Z'),date=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+1);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(date,last));return d.toISOString().slice(0,10)}
function initializeStudy(){store.study=store.study||{};if(store.studyVersion===1)return;for(const s of Object.values(store.progress))if(s.level==='mastered')s.level='recall';store.studyVersion=1}
function journal(id,create=false){const root=learningStore();root.study=root.study||{};const mode=root.study[practiceMode]||(create?(root.study[practiceMode]={}):{});if(!mode[id]&&create)mode[id]={base:{r:clone(state(id,'r')),m:clone(state(id,'m'))},events:[],memory:emptyMemory()};return mode[id]}
function emptyMemory(){return {streak:0,due:'',lastSuccessDay:'',recallDay:'',recall:{r:false,m:false}}}
function memory(id){return journal(id)?.memory||emptyMemory()}
function replayStudy(id){const j=journal(id,true),states=clone(j.base),m=emptyMemory();for(const e of j.events){
 applyGrade(states[e.aspect],e.correct,{method:e.method,day:e.day});
 if(m.recallDay!==e.day){m.recallDay=e.day;m.recall={r:false,m:false}}
 if(!e.correct){m.streak=0;m.due=e.day;m.lastSuccessDay='';m.recall={r:false,m:false};for(const s of Object.values(states)){s.level='choice';s.streak=0}}
 else if(e.method==='recall'){m.recall[e.aspect]=true;if(m.recall.r&&m.recall.m&&m.lastSuccessDay!==e.day&&(!m.due||e.day>=m.due)){m.streak++;m.lastSuccessDay=e.day;m.due=m.streak===1?addDays(e.day,1):m.streak===2?addDays(e.day,7):addMonth(e.day)}}
 }j.memory=m;for(const a of ['r','m']){states[a].due=m.due;setState(id,a,states[a])}return m}
function dailyFacts(id,day=today()){const events=(journal(id)?.events||[]).filter(e=>e.day===day);return {answered:!!events.length,choice:events.some(e=>e.correct&&e.method==='choice'),recall:events.some(e=>e.correct&&e.method==='recall'),wrong:events.some(e=>!e.correct),ok:memory(id).lastSuccessDay===day}}
function cleanFilters(v={}){return {scope:['due','all','established','waiting','unestablished','review'].includes(v?.scope)?v.scope:'due',status:['all','new','wrongToday','everWrong','choice','recall'].includes(v?.status)?v.status:'all',streak:['all','0','1','2','3+'].includes(v?.streak)?v.streak:'all',excludeChoice:!!v?.excludeChoice,excludeRecall:!!v?.excludeRecall,excludeAnswered:!!v?.excludeAnswered,query:typeof v?.query==='string'?v.query:''}}
function matchesStudyFilters(x){const f=quizFilters,m=memory(x.id),facts=dailyFacts(x.id),r=state(x.id,'r'),v=state(x.id,'m'),waiting=!!m.due&&m.due>today();
 if((f.scope==='due'&&waiting)||(f.scope==='established'&&!m.streak)||(f.scope==='waiting'&&!waiting)||(f.scope==='unestablished'&&m.streak)||(f.scope==='review'&&(!m.streak||waiting)))return false;
 if((f.excludeChoice&&facts.choice)||(f.excludeRecall&&facts.recall)||(f.excludeAnswered&&facts.answered))return false;
 if(f.streak!=='all'&&(f.streak==='3+'?m.streak<3:m.streak!==+f.streak))return false;
 if((f.status==='new'&&(r.graded||v.graded))||(f.status==='wrongToday'&&!facts.wrong)||(f.status==='everWrong'&&!(r.wrong+v.wrong))||(f.status==='choice'&&r.level!=='choice'&&v.level!=='choice')||(f.status==='recall'&&(r.level==='choice'||v.level==='choice')))return false;
 return !f.query||(x.word+x.reading+x.meaning).includes(f.query)}
function studyFilterHtml(){const f=quizFilters,options=(list,value)=>list.map(([key,label])=>`<option value="${key}" ${key===value?'selected':''}>${label}</option>`).join('');return `<div class="study-filters"><div class="filter-main"><label>出題対象<select id="studyScope">${options([['due','通常：復習待ちを除く'],['all','すべて'],['established','定着したもののみ（1回以上）'],['waiting','復習日を待っているもの'],['review','定着済みで復習日が来たもの'],['unestablished','定着0回のもの']],f.scope)}</select></label><span class="notice">今日：${today()}（日本時間・朝4時区切り）</span></div><details id="studyFilterDetails" ${store.settings.filtersOpen?'open':''}><summary>さらに絞り込む</summary><div class="filter-fields"><label>状態<select id="studyStatus">${options([['all','すべて'],['new','未学習'],['wrongToday','今日、間違えた'],['everWrong','これまでに間違えた'],['choice','四択が残っている'],['recall','読み・意味とも思い出す形式']],f.status)}</select></label><label>定着の連続正解<select id="studyStreak">${options([['all','指定なし'],['0','0回'],['1','1回：翌日復習'],['2','2回：1週間後復習'],['3+','3回以上：1か月ごと']],f.streak)}</select></label><label>語句を検索<input type="search" id="studyQuery" value="${esc(f.query)}" placeholder="語句・読み・意味（Enterで検索）"></label></div><div class="filter-checks">${[['excludeChoice','今日、四択で正解した語義を除く'],['excludeRecall','今日、自力で正解した語義を除く'],['excludeAnswered','今日、回答した語義を除く']].map(([key,label])=>`<label><input type="checkbox" data-study-exclude="${key}" ${f[key]?'checked':''}>${label}</label>`).join('')}</div><p class="notice">除外は読み・意味のセット単位。多義語は語義ごとに管理します。条件はすべて組み合わせられます。</p><button class="btn small" type="button" id="resetStudyFilters">標準に戻す</button></details><p class="notice">回答結果はそのまま残ります。「もう一度練習」で最新の条件を適用します。</p></div>`}
function memoryStatus(x){const m=memory(x.id);return `<div class="memory-status"><span>定着 ${m.streak}回連続</span>${dailyFacts(x.id).ok?'<span class="grade-ok">今日OK</span>':''}${m.due?`<span>次回 ${m.due} 朝4時</span>`:''}${!recording?'<span>記録しない練習</span>':''}</div>`}
function updateRecordToggle(){const b=document.querySelector('#recordToggle');if(!b)return;b.setAttribute('aria-checked',String(recording));b.classList.toggle('is-off',!recording);b.innerHTML=`<span class="toggle-track"><span></span></span>${recording?'記録する':'記録しない'}`}
function switchRecording(){if(recording){save();recording=false;sandbox=clone(store);scratchSessions={}}else{recording=true;sandbox=null;scratchSessions={}}store.settings.recording=recording;answers={};results={};batch=[];if(!restoreSession())newBatch();render()}
function refreshStudyDay(){const day=today();if(day===activeDay)return false;activeDay=day;answers={};results={};newBatch();if(ready)render();return true}
function bindStudyFilters(){const update=(key,value)=>{quizFilters[key]=value;answers={};results={};newBatch();render()};for(const [id,key] of [['studyScope','scope'],['studyStatus','status'],['studyStreak','streak'],['studyQuery','query']])document.querySelector('#'+id)?.addEventListener('change',e=>update(key,e.target.value));app.querySelectorAll('[data-study-exclude]').forEach(el=>el.addEventListener('change',()=>update(el.dataset.studyExclude,el.checked)));document.querySelector('#resetStudyFilters')?.addEventListener('click',()=>{quizFilters=cleanFilters();answers={};results={};newBatch();render()});const query=document.querySelector('#studyQuery');query?.addEventListener('input',e=>{quizFilters.query=e.target.value});query?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();update('query',e.target.value)}});document.querySelector('#studyFilterDetails')?.addEventListener('toggle',e=>{store.settings.filtersOpen=e.target.open;save()})}

function validStore(x){return x&&typeof x==='object'&&x.progress&&typeof x.progress==='object'&&!Array.isArray(x.progress)&&x.edits&&typeof x.edits==='object'&&!Array.isArray(x.edits)}
function prepareStore(x){return {...x,history:Array.isArray(x.history)?x.history:[],settings:x.settings&&typeof x.settings==='object'?x.settings:{}}}
function load(){try{const x=JSON.parse(localStorage.getItem(key));if(validStore(x)){localLoaded=true;return prepareStore(x)}}catch(e){storageWarning=true}return {progress:{},edits:{},history:[],settings:{}}}
function openBackupDb(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{
 if(!('indexedDB' in window)){reject(Error('unavailable'));return}
 const req=indexedDB.open('kanbun_local_backup',1);
 req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data')};
 req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('blocked'));
});return dbPromise}
async function readBackup(){const db=await openBackupDb();return new Promise((resolve,reject)=>{const req=db.transaction('data','readonly').objectStore('data').get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function writeBackup(snapshot){const db=await openBackupDb();return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(snapshot,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function updateSaveStatus(){const el=document.querySelector('#saveStatus');if(!el)return;el.textContent=(savedLocally?'端末に保存済み':storageWarning?'端末への保存に失敗しています。学習データ保存でバックアップしてください。':'端末に保存中…')+(offlineReady?' ・ オフライン利用可':'');el.style.color=storageWarning?'var(--red)':'var(--muted)'}
function captureSession(){store.practiceMode=practiceMode;store.settings.quiz={page,category,orderMode,filters:quizFilters};store.settings.recording=recording;
 const q={version:3,day:activeDay,tab,page,category,search,batch:[...batch],results:clone(results),answers:clone(answers),showAnswers,orderMode,filters:clone(quizFilters),scrollY:window.scrollY||0};
 if(!recording){scratchSessions[practiceMode]=q;return}store.session=q;store.sessions=store.sessions||{};store.sessions[practiceMode]=q;
}
function save(){if(!ready)return;captureSession();store.savedAt=Date.now();const snapshot=JSON.stringify(store),revision=++saveRevision;let primary=false;
 try{localStorage.setItem(key,snapshot);primary=true;savedLocally=true;storageWarning=false}catch(e){savedLocally=false;storageWarning=true}
 updateSaveStatus();
 mirrorWrites=mirrorWrites.catch(()=>{}).then(()=>writeBackup(JSON.parse(snapshot))).then(()=>{if(revision===saveRevision){savedLocally=true;storageWarning=false;updateSaveStatus()}}).catch(()=>{if(revision===saveRevision&&!primary){savedLocally=false;storageWarning=true;updateSaveStatus()}});
}
function restoreSession(){const q=recording?(store.sessions?.[practiceMode]||(practiceMode==='word'?store.session:null)):scratchSessions[practiceMode],preferences=q||store.settings.quiz||{};
 tab=['quiz','words','progress'].includes(preferences.tab)?preferences.tab:'quiz';page=['すべて','表','裏'].includes(preferences.page)?preferences.page:'すべて';category=typeof preferences.category==='string'?preferences.category:'すべて';search=typeof preferences.search==='string'?preferences.search:'';
 orderMode=preferences.orderMode==='random'?'random':'ordered';showAnswers=preferences.showAnswers!==false;quizFilters=cleanFilters(preferences.filters);
 if(!q||(q.day&&q.day!==today())||![1,2,3].includes(q.version)||!q.answers||typeof q.answers!=='object'||!q.results||typeof q.results!=='object')return false;
 answers=clone(q.answers);results={};
 for(const [k,r] of Object.entries(q.results))if(questionKey(k)&&r&&r.before&&typeof r.correct==='boolean'&&!r.skipped){
  results[k]={...r,historyIndex:q.version===1?q.historyIndex:r.historyIndex};
 }
 const expected=groupEntries(filtered()).flat().map(x=>x.id);
 const valid=[2,3].includes(q.version)&&Array.isArray(q.batch)&&new Set(q.batch).size===q.batch.length&&q.batch.every(id=>expected.includes(id));
 if(valid)batch=q.batch;else newBatch();
 // Migrate pending answers from the older batch screen exactly once.
 if(q.version===1)for(const [k,value] of Object.entries(answers)){
  const parts=questionKey(k);if(!parts||results[k])continue;
  const [id,a]=parts,x=item(id),before=state(id,a);
  if(before.level==='choice'&&typeof value==='string'&&value.trim())recordGrade(k,isCorrect(value,x[a==='r'?'reading':'meaning']));
  else if(before.level!=='choice'&&value?.revealed&&typeof value.correct==='boolean')recordGrade(k,value.correct);
 }
 return valid;
}
function questionKey(k){const m=/^(\d+):(r|m)$/.exec(k);return m&&data.some(x=>x.id===+m[1])?[+m[1],m[2]]:null}
async function start(){app.innerHTML='<div class="panel sub">学習データを読み込み中…</div>';
 try{const backup=await readBackup();if(validStore(backup)&&(!localLoaded||(backup.savedAt||0)>(store.savedAt||0))){store=prepareStore(backup);localLoaded=true}}catch(e){}
 practiceMode=store.practiceMode==='example'?'example':'word';migrateCards();initializeStudy();recording=store.settings.recording!==false;if(!recording)sandbox=clone(store);activeDay=today();const scroll=Number(store.session?.scrollY)||0,restored=restoreSession();if(!restored)newBatch();ready=true;render();
 if(restored)requestAnimationFrame(()=>window.scrollTo({top:scroll,behavior:'instant'}));

}
function progress(){let x=levelCount(),pct=Math.round(x.master/x.all*100),p=learningStore().progress;let seen=Object.entries(p).filter(([k,z])=>k.startsWith('example:')===(practiceMode==='example')&&z.graded>0).map(([,z])=>z);let wrong=seen.reduce((a,b)=>a+b.wrong,0),c=seen.reduce((a,b)=>a+b.mc+b.free,0);let difficult=items().map(x=>({x,wrong:state(x.id,'r').wrong+state(x.id,'m').wrong})).filter(o=>o.wrong).sort((a,b)=>b.wrong-a.wrong).slice(0,12);
return stats()+`<div class="panel"><h2 class="heading">定着の進み具合</h2><div class="flex"><strong style="font-size:28px">${pct}%</strong><span class="sub">${x.master} / ${x.all} 項目 定着</span></div><div class="bar"><div style="width:${pct}%"></div></div><p class="sub">読み・意味を両方、自力で正解したら定着1回。初回は翌日、2回目は1週間後、3回目以降は1か月後に復習します。同じ日に繰り返しても回数は進みません。どちらかを間違えると0回・両方四択に戻ります。多義語は語義ごと、語句・例文モードは別管理。学習日は日本時間の朝4時に切り替わります。</p><div class="flex"><div class="stat grow"><strong>${c+wrong?Math.round(c/(c+wrong)*100):0}%</strong><span>累計正答率</span></div><div class="stat grow"><strong>${wrong}</strong><span>累計誤答</span></div></div></div><div class="panel"><h2 class="heading">苦手な語句</h2>${difficult.length?difficult.map(o=>`<div class="worditem"><b>${esc(o.x.word)}</b><span class="item-score">誤答 ${o.wrong} 回</span><div class="sub">${esc(overviewText(o.x))}</div></div>`).join(''):'<p class="sub">まだ誤答の記録はありません。</p>'}</div><div class="panel"><h2 class="heading">データ管理</h2><p class="sub">学習履歴・回答途中の選択・現在の問題は操作ごとに端末内へ自動保存します。再読み込みしても続きから再開できます。別のブラウザやホーム画面のアプリ、別端末には自動同期しません。</p><div class="flex"><button class="btn small" id="export">学習データ保存</button><label class="btn small" style="cursor:pointer">データを復元<input type="file" id="import" accept="application/json,.json" class="hide"></label><button class="btn small danger" id="reset">学習履歴をリセット</button></div></div>`
}
function render(){updateRecordToggle();document.querySelectorAll('nav button').forEach(el=>el.classList.toggle('active',el.dataset.tab===tab));app.innerHTML=tab==='quiz'?quiz():tab==='words'?words():progress();bind();save()}
function bind(){
if(tab==='quiz'){
 bindStudyFilters();document.querySelector('#practiceMode')?.addEventListener('change',e=>switchMode(e.target.value));
 app.querySelectorAll('[data-example]').forEach(button=>button.addEventListener('click',()=>{answers['_example_'+button.dataset.example]=!answers['_example_'+button.dataset.example];render()}));
 document.querySelector('#pageSelect')?.addEventListener('change',e=>{page=e.target.value;category='すべて';changeScope()});
 document.querySelector('#categorySelect')?.addEventListener('change',e=>{category=e.target.value;changeScope()});
 document.querySelector('#orderSelect')?.addEventListener('change',e=>{orderMode=e.target.value;changeScope()});
 document.querySelector('#reshuffle')?.addEventListener('click',changeScope);
 document.querySelector('#restart')?.addEventListener('click',restartPractice);
 app.querySelectorAll('[data-question]').forEach(bindQuestion);
}else if(tab==='words'){
 document.querySelector('#wordPage')?.addEventListener('change',e=>{page=e.target.value;category='すべて';newBatch();render()});
 document.querySelector('#wordCategory')?.addEventListener('change',e=>{category=e.target.value;newBatch();render()});
 document.querySelector('#wordSearch')?.addEventListener('input',e=>{search=e.target.value;let at=e.target.selectionStart;render();let inp=document.querySelector('#wordSearch');inp.focus();inp.setSelectionRange(at,at)});
 document.querySelector('#toggleAnswers')?.addEventListener('click',()=>{showAnswers=!showAnswers;render()});
 app.querySelectorAll('[data-edit]').forEach(el=>el.addEventListener('click',()=>openEdit(+el.dataset.edit)));
}else{
 document.querySelector('#export')?.addEventListener('click',exportData);
 document.querySelector('#import')?.addEventListener('change',importData);
 document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('学習履歴をすべてリセットしますか？ 語句の修正は残します。')){const root=learningStore();for(const k of Object.keys(root.progress))if(k.startsWith('example:')===(practiceMode==='example'))delete root.progress[k];if(root.study)delete root.study[practiceMode];answers={};results={};newBatch();render()}});
}}
function applyGrade(s,correct,{method=s.level==='choice'?'choice':'recall',day=today()}={}){if(correct){if(method==='choice')s.mc++;else{s.free++;s.streak++}s.level='recall'}else{s.wrong++;s.streak=0;s.level='choice';s.firstFreeDay='';s.laterHit=false}s.last=day;s.graded++}
function override(k){if(refreshStudyDay())return;const r=results[k],parts=questionKey(k);if(!r||!parts)return;const want=!r.correct,[id,a]=parts,j=journal(id,true),event=j.events.find(e=>e.id===r.eventId);if(event){event.correct=want;replayStudy(id)}else{const s=clone(r.before);applyGrade(s,want);j.base[a]=s;replayStudy(id)}r.correct=want;const history=learningStore().history[r.historyIndex];if(history)history.correct+=want?1:-1;refreshQuestion(k)}
function openEdit(id){editId=id;let x=item(id);document.querySelector('#editWord').value=x.word;document.querySelector('#editReading').value=x.reading;document.querySelector('#editMeaning').value=x.meaning;document.querySelector('#editor').showModal()}
document.querySelector('#editCancel').addEventListener('click',()=>document.querySelector('#editor').close());
document.querySelector('#editForm').addEventListener('submit',e=>{if(e.submitter?.value!=='save')return;let w=document.querySelector('#editWord').value.trim(),r=document.querySelector('#editReading').value.trim(),m=document.querySelector('#editMeaning').value.trim();if(!w||!r||!m){e.preventDefault();alert('すべて入力してください');return}store.edits[editId]={word:w,reading:r,meaning:m};save();render()});
function exportData(){const blob=new Blob([JSON.stringify({version:1,store},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='漢文暗記バックアップ_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){let file=e.target.files?.[0];if(!file)return;file.text().then(s=>{let v=JSON.parse(s);if(v.version!==1||!v.store?.progress||!v.store?.edits)throw Error('対応しないデータ');if(confirm('現在の学習データを読み込んだデータに置き換えますか？')){store=prepareStore(v.store);initializeStudy();recording=store.settings.recording!==false;sandbox=recording?null:clone(store);scratchSessions={};activeDay=today();practiceMode=store.practiceMode==='example'?'example':'word';migrateCards();answers={};results={};if(!restoreSession())newBatch();render()}}).catch(err=>alert('読み込みに失敗しました：'+err.message))}
document.querySelectorAll('nav button').forEach(x=>x.addEventListener('click',()=>{if(!ready)return;tab=x.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'})}));
// Persist before iOS suspends the page; there is no automatic reload.
window.addEventListener('pagehide',()=>save());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();else if(ready)refreshStudyDay()});
setInterval(()=>{if(ready&&document.visibilityState!=='hidden')refreshStudyDay()},30000);
let scrollTimer;window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>save(),250)},{passive:true});
if('serviceWorker' in navigator && location.protocol==='https:'){
 navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;updateSaveStatus()}).catch(()=>{});
}
document.querySelector('#recordToggle').addEventListener('click',()=>{if(ready)switchRecording()});
start();
})();
</script></body></html>
